[project]
name = "agenteval-api"
version = "0.1.0"
description = "API REST de agenteval: lanza evaluaciones y persiste resultados."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "agenteval",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenteval_api"]

[tool.uv.sources]
agenteval = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Importar core y api desde src (ver nota en packages/core/pyproject.toml).
pythonpath = ["src", "../core/src"]
