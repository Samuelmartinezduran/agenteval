[project]
name = "agenteval"
version = "0.1.0"
description = "Framework open source para evaluar agentes LLM con function calling / tool use."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agenteval contributors" }]
keywords = ["llm", "agents", "evaluation", "function-calling", "tool-use"]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
agenteval = "agenteval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenteval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Importar desde src directamente: evita depender del editable install, que en
# macOS se rompe por el bug uv+CPython de los .pth ocultos (ver Makefile/README).
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer usa llamadas (Option/Argument) en los defaults; es el idiom estándar.
"src/agenteval/cli.py" = ["B008"]
